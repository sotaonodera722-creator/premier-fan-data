name: Update Premier League data

on:
  schedule:
    # Every 4 hours (6 times a day). GitHub's cron is best-effort and may run
    # a few minutes late, and schedules are paused after 60 days with no
    # commits to the repo — a manual run (below) always re-arms it.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Fetch teams, standings, players & matches
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: node scripts/ingest-football-data.mjs

      - name: Fetch lineups, events & match statistics
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
        run: node scripts/ingest-lineups.mjs

      - name: Fetch head-to-head history
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: node scripts/ingest-h2h.mjs

      # A refresh that the site cannot build is worse than a stale one: Vercel
      # deploys whatever lands on main, so a build failure here is the last
      # chance to keep it off the live site.
      - name: Build against the refreshed data
        run: npm run build

      - name: Commit and push data changes
        id: commit
        run: |
          if git diff --quiet -- src/data; then
            echo "No data changes this run."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "chore: automated data refresh"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Deliberately after the push, not before. A broken invariant is usually a
      # fact about the feed rather than a reason to stop publishing results, and
      # halting the refresh would leave the site showing last week's scores —
      # a worse failure than the one being reported. Failing here still turns
      # the run red, which is what sends the owner an email.
      - name: Data invariants
        id: audit
        run: npm run audit | tee audit.log

      # A red run does email the owner, but an email is read once and then gone,
      # and this runs unattended six times a day. An issue stays until someone
      # closes it, and the next refresh adds to it rather than opening a second.
      - name: Report a broken invariant as an issue
        if: always() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '自動更新後の `npm run audit` が不合格を出しました。'
            echo
            echo "- 実行: $RUN_URL"
            echo "- データのコミット: $GITHUB_SHA"
            echo
            echo '```'
            # -F because [不合格] is a bracket expression to grep otherwise, and
            # would match almost every line. Only the failures: the notices are
            # measurements we do not control and are noise in an alert.
            grep -F -B1 -A6 '[不合格]' audit.log || echo '(不合格の行を取り出せませんでした)'
            echo '```'
            echo
            echo '検査は push の**後**に走ります。壊れた不変条件はたいてい提供元の事実で、'
            echo '更新を止めると先週のスコアを見せることになるためです。'
            echo '**つまりこのデータは既に公開されています。**'
            echo
            echo '最初に確かめること: 提供元の欠損か、こちらの導出ロジックの誤りか。'
            echo '提供元の事実なら検査を注意（soft）に落とすかの判断、'
            echo 'こちらの誤りなら `src/lib/data.ts` の修正です。'
          } > "$RUNNER_TEMP/issue-body.md"
          existing=$(gh issue list --label data-invariant --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh label create data-invariant --description '自動更新後の不変条件の不合格' --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --title 'データの不変条件が壊れています' --label data-invariant --body-file "$RUNNER_TEMP/issue-body.md"
          fi
