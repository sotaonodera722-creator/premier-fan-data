name: Update Premier League data

on:
  schedule:
    # Every 4 hours (6 times a day). GitHub's cron is best-effort and may run
    # a few minutes late, and schedules are paused after 60 days with no
    # commits to the repo — a manual run (below) always re-arms it.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Fetch teams, standings, players & matches
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: node scripts/ingest-football-data.mjs

      - name: Fetch lineups, events & match statistics
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
        run: node scripts/ingest-lineups.mjs

      - name: Fetch head-to-head history
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: node scripts/ingest-h2h.mjs

      # A refresh that the site cannot build is worse than a stale one: Vercel
      # deploys whatever lands on main, so a build failure here is the last
      # chance to keep it off the live site.
      - name: Build against the refreshed data
        run: npm run build

      - name: Commit and push data changes
        id: commit
        run: |
          if git diff --quiet -- src/data; then
            echo "No data changes this run."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "chore: automated data refresh"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Deliberately after the push, not before. A broken invariant is usually a
      # fact about the feed rather than a reason to stop publishing results, and
      # halting the refresh would leave the site showing last week's scores —
      # a worse failure than the one being reported. Failing here still turns
      # the run red, which is what sends the owner an email.
      - name: Data invariants
        run: npm run audit
